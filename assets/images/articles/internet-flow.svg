<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1180" viewBox="0 0 840 1180" role="img" aria-labelledby="title desc"><title id="title">Webページが表示されるまでの8段階</title><desc id="desc">スマートフォンからWi-Fiルーター、インターネットを通りWebサーバーへ。DNSの照会、HTTPリクエスト、レスポンスの向きと8段階を示します。</desc><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d739a"/></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b76b4b"/></marker><marker id="next" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#526e7e"/></marker></defs><rect width="840" height="1180" rx="28" fill="#f5f9fb"/><text x="420" y="42" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="750" fill="#16344d"><tspan x="420" dy="0">リンクをタップしてページが見えるまで</tspan></text><rect x="12" y="90" width="186" height="82" rx="15" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="105.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2d739a"><tspan x="105.0" dy="0">スマートフォン</tspan></text><text x="105.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#526e7e"><tspan x="105.0" dy="0">利用者が操作する端末</tspan></text><rect x="222" y="90" width="186" height="82" rx="15" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="315.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2d739a"><tspan x="315.0" dy="0">Wi-Fiルーター</tspan></text><text x="315.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#526e7e"><tspan x="315.0" dy="0">端末を家庭・施設のネットワー</tspan><tspan x="315.0" dy="16">クへ</tspan></text><rect x="432" y="90" width="186" height="82" rx="15" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="525.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2d739a"><tspan x="525.0" dy="0">インターネット</tspan></text><text x="525.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#526e7e"><tspan x="525.0" dy="0">ネットワーク同士をつなぐ仕組</tspan><tspan x="525.0" dy="16">み</tspan></text><rect x="642" y="90" width="186" height="82" rx="15" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="735.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2d739a"><tspan x="735.0" dy="0">Webサーバー</tspan></text><text x="735.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#526e7e"><tspan x="735.0" dy="0">ページデータを保管し要求に応</tspan><tspan x="735.0" dy="16">じて返す</tspan></text><path d="M198 116H220" stroke="#2d739a" stroke-width="2.5" marker-end="url(#request)"/><path d="M222 145H200" stroke="#b76b4b" stroke-width="2.5" marker-end="url(#response)"/><path d="M408 116H430" stroke="#2d739a" stroke-width="2.5" marker-end="url(#request)"/><path d="M432 145H410" stroke="#b76b4b" stroke-width="2.5" marker-end="url(#response)"/><path d="M618 116H640" stroke="#2d739a" stroke-width="2.5" marker-end="url(#request)"/><path d="M642 145H620" stroke="#b76b4b" stroke-width="2.5" marker-end="url(#response)"/><rect x="255" y="190" width="330" height="50" rx="14" fill="#e9f5fb" stroke="#9bc9dc" stroke-width="2"/><text x="420" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="650" fill="#16344d"><tspan x="420" dy="0">DNS：ドメイン名から接続先IPアドレスを調べる</tspan></text><text x="420" y="231" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#526e7e"><tspan x="420" dy="0">STEP 3で名前を照会し、接続先の手がかりを得る</tspan></text><path d="M105 169 C118 190 220 205 252 215" fill="none" stroke="#2d739a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#next)"/><path d="M255 215 C220 205 118 190 105 169" fill="none" stroke="#526e7e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#next)"/><text x="420" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="650" fill="#526e7e"><tspan x="420" dy="0">データはこの経路を往復：要求はサーバーへ、返事はスマホへ</tspan></text><rect x="12" y="310" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="32" y="340" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="32" dy="0">STEP 1</tspan></text><text x="32" y="372" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="32" dy="0">スマホでリンクをタップ</tspan></text><text x="32" y="412" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="32" dy="0">見たいページのリンクを選びます。リンク先のUR</tspan><tspan x="32" dy="20">Lが、ブラウザに渡されます。</tspan></text><rect x="430" y="310" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="450" y="340" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="450" dy="0">STEP 2</tspan></text><text x="450" y="372" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="450" dy="0">ブラウザがページを取りに行く</tspan></text><text x="450" y="412" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="450" dy="0">SafariやChromeなどがURLを読み取</tspan><tspan x="450" dy="20">り、ページを取得する準備をします。</tspan></text><rect x="430" y="510" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="450" y="540" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="450" dy="0">STEP 3</tspan></text><text x="450" y="572" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="450" dy="0">DNSがドメイン名を調べる</tspan></text><text x="450" y="612" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="450" dy="0">DNSという仕組みが、URLに含まれるドメイン</tspan><tspan x="450" dy="20">名に対応するIPアドレスを調べます。電話帳のよ</tspan><tspan x="450" dy="20">うな役割ですが、実際の仕組みは電話帳そのもので</tspan><tspan x="450" dy="20">はありません。</tspan></text><rect x="12" y="510" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="32" y="540" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="32" dy="0">STEP 4</tspan></text><text x="32" y="572" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="32" dy="0">IPアドレスを手がかりに接続する</tspan></text><text x="32" y="612" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="32" dy="0">IPアドレスは通信相手を識別する番号です。スマ</tspan><tspan x="32" dy="20">ホはWi-Fiルーターなどを通じてネットワーク</tspan><tspan x="32" dy="20">につながり、そのIPアドレスを手がかりに宛先の</tspan><tspan x="32" dy="20">サーバーとの通信を始めます。</tspan></text><rect x="12" y="710" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="32" y="740" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="32" dy="0">STEP 5</tspan></text><text x="32" y="772" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="32" dy="0">HTTPリクエストを送る</tspan></text><text x="32" y="812" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="32" dy="0">ブラウザがサーバーに「このページをください」と</tspan><tspan x="32" dy="20">要求します。リクエストは、相手に送るお願いです</tspan><tspan x="32" dy="20">。</tspan></text><rect x="430" y="710" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="450" y="740" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="450" dy="0">STEP 6</tspan></text><text x="450" y="772" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="450" dy="0">HTTPレスポンスが返る</tspan></text><text x="450" y="812" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="450" dy="0">サーバーが要求を受け取り、結果を返します。レス</tspan><tspan x="450" dy="20">ポンスは、リクエストへの返事です。</tspan></text><rect x="430" y="910" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="450" y="940" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="450" dy="0">STEP 7</tspan></text><text x="450" y="972" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="450" dy="0">ページの材料が届く</tspan></text><text x="450" y="1012" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="450" dy="0">HTML（文章や構造）、CSS（色や配置）、画</tspan><tspan x="450" dy="20">像などのデータが届きます。ページによって、追加</tspan><tspan x="450" dy="20">のデータを別途取得することもあります。</tspan></text><rect x="12" y="910" width="398" height="180" rx="16" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="32" y="940" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="800" fill="#2d739a"><tspan x="32" dy="0">STEP 8</tspan></text><text x="32" y="972" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="750" fill="#16344d"><tspan x="32" dy="0">ブラウザが画面に表示する</tspan></text><text x="32" y="1012" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="400" fill="#526e7e"><tspan x="32" dy="0">ブラウザが届いた材料を読み取り、文字や画像、レ</tspan><tspan x="32" dy="20">イアウトを組み立ててWebページとして表示しま</tspan><tspan x="32" dy="20">す。</tspan></text><path d="M410 400H430" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><path d="M430 600H410" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><path d="M410 800H430" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><path d="M430 1000H410" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><path d="M818 493V502" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><path d="M22 693V702" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><path d="M818 893V902" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="12" y="1110" width="816" height="50" rx="14" fill="#e9f5fb" stroke="#d1e5ee"/><text x="420" y="1141" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="550" fill="#16344d"><tspan x="420" dy="0">青＝リクエストをサーバーへ　｜　橙＝レスポンスとページ材料をスマホへ</tspan></text></svg>