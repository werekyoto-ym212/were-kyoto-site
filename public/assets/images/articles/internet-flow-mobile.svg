<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3190" viewBox="0 0 390 3190" role="img" aria-labelledby="title desc"><title id="title">Webページが表示されるまでの8段階（スマートフォン版）</title><desc id="desc">スマートフォン、Wi-Fiルーター、インターネット、Webサーバーの役割と、本文と同じ8段階を上から順に示します。</desc><defs><marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d739a"/></marker><marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b76b4b"/></marker><marker id="next" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#526e7e"/></marker></defs><rect width="390" height="3190" rx="28" fill="#f5f9fb"/><text x="195" y="45" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="750" fill="#16344d"><tspan x="195" dy="0">Webページが見えるまで</tspan></text><rect x="22" y="76" width="346" height="54" rx="12" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="38" y="98" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="750" fill="#2d739a"><tspan x="38" dy="0">スマートフォン</tspan></text><text x="38" y="119" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#526e7e"><tspan x="38" dy="0">利用者が操作する端末</tspan></text><path d="M195 131v8" stroke="#2d739a" stroke-width="2" marker-end="url(#next)"/><rect x="22" y="142" width="346" height="54" rx="12" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="38" y="164" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="750" fill="#2d739a"><tspan x="38" dy="0">Wi-Fiルーター</tspan></text><text x="38" y="185" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#526e7e"><tspan x="38" dy="0">家庭・施設のネットワークへつなぐ</tspan></text><path d="M195 197v8" stroke="#2d739a" stroke-width="2" marker-end="url(#next)"/><rect x="22" y="208" width="346" height="54" rx="12" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="38" y="230" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="750" fill="#2d739a"><tspan x="38" dy="0">インターネット</tspan></text><text x="38" y="251" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#526e7e"><tspan x="38" dy="0">ネットワーク同士をつなぐ</tspan></text><path d="M195 263v8" stroke="#2d739a" stroke-width="2" marker-end="url(#next)"/><rect x="22" y="274" width="346" height="54" rx="12" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="38" y="296" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="750" fill="#2d739a"><tspan x="38" dy="0">Webサーバー</tspan></text><text x="38" y="317" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#526e7e"><tspan x="38" dy="0">ページデータを保管し要求に応じて返す</tspan></text><text x="195" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#526e7e"><tspan x="195" dy="0">通信経路は往復（要求はサーバーへ、返事は端末へ）</tspan></text><rect x="22" y="365" width="346" height="62" rx="13" fill="#e9f5fb" stroke="#9bc9dc" stroke-width="2"/><text x="195" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#16344d"><tspan x="195" dy="0">DNS：ドメイン名からIPアドレスを調べる</tspan></text><text x="195" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#526e7e"><tspan x="195" dy="0">接続先を探すための仕組み</tspan></text><rect x="22" y="448" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="483" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 1</tspan></text><text x="42" y="520" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">スマホでリンクをタップ</tspan></text><text x="42" y="580" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">見たいページのリンクを選びます。リ</tspan><tspan x="42" dy="23">ンク先のURLが、ブラウザに渡され</tspan><tspan x="42" dy="23">ます。</tspan></text><path d="M195 751v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="772" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="807" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 2</tspan></text><text x="42" y="844" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">ブラウザがページを取りに行く</tspan></text><text x="42" y="904" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">SafariやChromeなどがU</tspan><tspan x="42" dy="23">RLを読み取り、ページを取得する準</tspan><tspan x="42" dy="23">備をします。</tspan></text><path d="M195 1075v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="1096" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="1131" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 3</tspan></text><text x="42" y="1168" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">DNSがドメイン名を調べる</tspan></text><text x="42" y="1228" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">DNSという仕組みが、URLに含ま</tspan><tspan x="42" dy="23">れるドメイン名に対応するIPアドレ</tspan><tspan x="42" dy="23">スを調べます。電話帳のような役割で</tspan><tspan x="42" dy="23">すが、実際の仕組みは電話帳そのもの</tspan><tspan x="42" dy="23">ではありません。</tspan></text><path d="M195 1399v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="1420" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="1455" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 4</tspan></text><text x="42" y="1492" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">IPアドレスを手がかりに接続す</tspan><tspan x="42" dy="27">る</tspan></text><text x="42" y="1552" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">IPアドレスは通信相手を識別する番</tspan><tspan x="42" dy="23">号です。スマホはWi-Fiルーター</tspan><tspan x="42" dy="23">などを通じてネットワークにつながり</tspan><tspan x="42" dy="23">、そのIPアドレスを手がかりに宛先</tspan><tspan x="42" dy="23">のサーバーとの通信を始めます。</tspan></text><path d="M195 1723v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="1744" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="1779" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 5</tspan></text><text x="42" y="1816" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">HTTPリクエストを送る</tspan></text><text x="42" y="1876" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">ブラウザがサーバーに「このページを</tspan><tspan x="42" dy="23">ください」と要求します。リクエスト</tspan><tspan x="42" dy="23">は、相手に送るお願いです。</tspan></text><text x="42" y="2022" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="750" fill="#2d739a"><tspan x="42" dy="0">青：リクエストをサーバーへ →</tspan></text><path d="M195 2047v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="2068" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="2103" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 6</tspan></text><text x="42" y="2140" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">HTTPレスポンスが返る</tspan></text><text x="42" y="2200" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">サーバーが要求を受け取り、結果を返</tspan><tspan x="42" dy="23">します。レスポンスは、リクエストへ</tspan><tspan x="42" dy="23">の返事です。</tspan></text><text x="42" y="2346" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="750" fill="#b76b4b"><tspan x="42" dy="0">← 橙：レスポンス・材料が戻る</tspan></text><path d="M195 2371v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="2392" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="2427" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 7</tspan></text><text x="42" y="2464" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">ページの材料が届く</tspan></text><text x="42" y="2524" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">HTML（文章や構造）、CSS（色</tspan><tspan x="42" dy="23">や配置）、画像などのデータが届きま</tspan><tspan x="42" dy="23">す。ページによって、追加のデータを</tspan><tspan x="42" dy="23">別途取得することもあります。</tspan></text><text x="42" y="2670" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="750" fill="#b76b4b"><tspan x="42" dy="0">← 橙：レスポンス・材料が戻る</tspan></text><path d="M195 2695v16" stroke="#526e7e" stroke-width="3" marker-end="url(#next)"/><rect x="22" y="2716" width="346" height="300" rx="17" fill="#fff" stroke="#dce8ee" stroke-width="2"/><text x="42" y="2751" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="850" fill="#2d739a"><tspan x="42" dy="0">STEP 8</tspan></text><text x="42" y="2788" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="750" fill="#16344d"><tspan x="42" dy="0">ブラウザが画面に表示する</tspan></text><text x="42" y="2848" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="400" fill="#526e7e"><tspan x="42" dy="0">ブラウザが届いた材料を読み取り、文</tspan><tspan x="42" dy="23">字や画像、レイアウトを組み立ててW</tspan><tspan x="42" dy="23">ebページとして表示します。</tspan></text><rect x="22" y="3022" width="346" height="74" rx="14" fill="#e9f5fb" stroke="#d1e5ee"/><text x="195" y="3050" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#2d739a"><tspan x="195" dy="0">図の見方</tspan></text><text x="195" y="3074" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#16344d"><tspan x="195" dy="0">青はサーバーへ送る要求、橙はスマホへ戻る返事</tspan></text></svg>