<svg xmlns="http://www.w3.org/2000/svg" width="420" height="728" viewBox="0 0 420 728" role="img" aria-labelledby="title desc"><title id="title">ドメインとは？サイトの名前とURLの違いを知ろう</title><desc id="desc">上から下へ順に読む四段階の説明図。URLを見る：https://shop.example.com/items。接続先を区切る：ホスト名は shop.example.com。名前の階層を読む：com → example → shop。DNSで接続先を調べる：名前から通信の手がかりへ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2d739a"/></marker></defs><rect width="420" height="728" rx="22" fill="#f7fbfd"/><rect x="16" y="20" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="48" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 01</text><text x="36" y="85" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">URLを見る</text><text x="36" y="121" fill="#526e7e" font-family="sans-serif" font-size="16">https://shop.example.com/items</text><path d="M210 155v28" fill="none" stroke="#2d739a" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="196" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="224" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 02</text><text x="36" y="261" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">接続先を区切る</text><text x="36" y="297" fill="#526e7e" font-family="sans-serif" font-size="16">ホスト名は shop.example.com</text><path d="M210 331v28" fill="none" stroke="#2d739a" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="372" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="400" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 03</text><text x="36" y="437" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">名前の階層を読む</text><text x="36" y="473" fill="#526e7e" font-family="sans-serif" font-size="16">com → example → shop</text><path d="M210 507v28" fill="none" stroke="#2d739a" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="548" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="576" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 04</text><text x="36" y="613" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">DNSで接続先を調べる</text><text x="36" y="649" fill="#526e7e" font-family="sans-serif" font-size="16">名前から通信の手がかりへ</text></svg>