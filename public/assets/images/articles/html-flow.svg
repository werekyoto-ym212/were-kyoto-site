<svg xmlns="http://www.w3.org/2000/svg" width="420" height="728" viewBox="0 0 420 728" role="img" aria-labelledby="title desc"><title id="title">HTMLとは？ページの文字が見出しやリンクになる仕組み</title><desc id="desc">上から下へ順に読む四段階の説明図。伝えたい内容を用意する：店名・営業時間・地図の案内。役割を付けて組む：見出し・段落・リンクなど。必要な情報を添える：属性で行き先や画像を指定。ブラウザが読み取る：内容の構造をもとに表示する</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2d739a"/></marker></defs><rect width="420" height="728" rx="22" fill="#f7fbfd"/><rect x="16" y="20" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="48" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 01</text><text x="36" y="85" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">伝えたい内容を用意する</text><text x="36" y="121" fill="#526e7e" font-family="sans-serif" font-size="16">店名・営業時間・地図の案内</text><path d="M210 155v28" fill="none" stroke="#2d739a" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="196" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="224" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 02</text><text x="36" y="261" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">役割を付けて組む</text><text x="36" y="297" fill="#526e7e" font-family="sans-serif" font-size="16">見出し・段落・リンクなど</text><path d="M210 331v28" fill="none" stroke="#2d739a" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="372" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="400" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 03</text><text x="36" y="437" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">必要な情報を添える</text><text x="36" y="473" fill="#526e7e" font-family="sans-serif" font-size="16">属性で行き先や画像を指定</text><path d="M210 507v28" fill="none" stroke="#2d739a" stroke-width="3" marker-end="url(#arrow)"/><rect x="16" y="548" width="388" height="126" rx="18" fill="white" stroke="#dce8ee"/><text x="36" y="576" fill="#2d739a" font-family="sans-serif" font-size="13" font-weight="700">STEP 04</text><text x="36" y="613" fill="#16344d" font-family="sans-serif" font-size="22" font-weight="700">ブラウザが読み取る</text><text x="36" y="649" fill="#526e7e" font-family="sans-serif" font-size="16">内容の構造をもとに表示する</text></svg>