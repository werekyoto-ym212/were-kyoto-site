<body><header class="header"><a href="/" class="header-logo" aria-label="were. トップへ"><img src="/logo/were-logo-white.svg" alt="were." width="126" height="25"></a><a href="/#contact"> トップへ戻る</a></header><main>    <section id="contact" class="contact theme-light" data-header-theme="light">

        <div class="contact-content contact-form-layout"><div><h1><span class="copy-line"><span class="keep-word">まだ、</span><span class="keep-word">何をしたら</span></span><span class="copy-line keep-word">いいか</span><span class="copy-line keep-word">分からなくても。</span></h1><p class="contact-copy">ご相談・お見積もりは無料です。<br>まず今の状況をお聞きして、必要なものだけをご提案します。</p></div><form class="contact-form" action="/api/contact" method="post" data-contact-form><div class="form-field"><label for="contact-name">お名前 <span>必須</span></label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required></div><div class="form-field"><label for="contact-business">店舗・事業名 <small>任意</small></label><input id="contact-business" name="business" type="text" autocomplete="organization" maxlength="150"></div><div class="form-field"><label for="contact-email">メールアドレス <span>必須</span></label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required></div><fieldset class="form-field"><legend>ご相談内容</legend><div class="choice-list"><label><input type="checkbox" name="topics" value="Webサイト"> Webサイト・EC</label><label><input type="checkbox" name="topics" value="予約システム"> 予約システム</label><label><input type="checkbox" name="topics" value="顧客管理・カルテ"> 顧客管理・カルテ</label><label><input type="checkbox" name="topics" value="まだ決まっていない"> まだ決まっていない</label></div></fieldset><div class="form-field"><label for="contact-booking">現在の予約受付方法 <small>任意</small></label><select id="contact-booking" name="booking_method"><option value="">選択してください</option><option>Instagram DM</option><option>LINE</option><option>電話</option><option>ホットペッパー</option><option>その他</option></select></div><div class="form-field"><label for="contact-timing">ご希望の時期 <small>任意</small></label><input id="contact-timing" name="timing" type="text" maxlength="100"></div><div class="form-field"><label for="contact-message">ご相談の内容</label><textarea id="contact-message" name="message" rows="6" maxlength="5000"></textarea></div><div class="form-field form-turnstile" data-turnstile-container><p>安全確認を読み込んでいます。</p></div><div class="form-trap" aria-hidden="true"><label for="contact-website">Webサイト</label><input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off" maxlength="200"></div><p class="form-status" data-form-status role="status" aria-live="polite" tabindex="-1"></p><button class="button button-dark" type="submit" disabled>無料で相談する</button><p class="form-note">フォームが使えない方は <a href="mailto:were.kyoto@gmail.com">were.kyoto@gmail.com</a> へ。</p></form></div>
